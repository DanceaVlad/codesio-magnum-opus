services:
  app-postgres:
    image: postgres:17-alpine
    container_name: magnum-opus-app-postgres
    environment:
      POSTGRES_DB: magnum_opus
      POSTGRES_USER: magnum_opus
      POSTGRES_PASSWORD: magnum_opus
    ports:
      - "5432:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnum_opus -d magnum_opus"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak-postgres:
    image: postgres:17-alpine
    container_name: magnum-opus-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: magnum-opus-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./dev/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy

volumes:
  app-postgres-data:
    name: magnum-opus-app-postgres-data
  keycloak-postgres-data:
    name: magnum-opus-keycloak-postgres-data
