<main class="shell">
  <section class="status-panel" aria-labelledby="app-title">
    <p class="eyebrow">Magnum Opus</p>
    <h1 id="app-title">{{ title() }}</h1>
    <dl>
      <div>
        <dt>API</dt>
        <dd>{{ runtimeConfig.apiBaseUrl() }}</dd>
      </div>
      <div>
        <dt>Issuer</dt>
        <dd>{{ runtimeConfig.oidcIssuer() }}</dd>
      </div>
      <div>
        <dt>Client</dt>
        <dd>{{ runtimeConfig.oidcClientId() }}</dd>
      </div>
    </dl>
  </section>

  <router-outlet />
</main>
