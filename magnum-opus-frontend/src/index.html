<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MagnumOpus</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="hsl(0 0% 100%)" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="hsl(240 10% 3.9%)" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      html {
        background-color: hsl(0 0% 100%);
      }
      html.dark {
        background-color: hsl(240 10% 3.9%);
      }
      html.no-transitions,
      html.no-transitions * {
        transition: none;
      }
    </style>

    <script>
      (function () {
        const html = document.documentElement;

        try {
          const theme = localStorage.theme;
          const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;

          const isSystem = theme === 'system' || !('theme' in localStorage);
          const isDark = theme === 'dark' || (isSystem && prefersDark);
          html.classList.add('scheme-light-dark');
          html.classList.toggle('dark', isDark);
          html.setAttribute('data-theme', theme ?? 'system');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <cds-root></cds-root>
  </body>
</html>
