[tools]
node = "24.15.0"
bun = "1.3.14"
java = "temurin-25.0.3+9.0.LTS"
lefthook = "2.1.9"
"npm:@angular/cli" = "22.0.0"

# === Main tasks ===
[tasks.apply]
description = "Apply all available automatic formatting and lint fixes. Run by developers."
depends = ["apply:frontend", "apply:backend"]

[tasks.check]
description = "Check formatting and linting for frontend and backend. Run in CI/CD and commit hooks."
depends = ["check:frontend", "check:backend"]

[tasks.dev]
description = "Start the full local dev environment: Docker services, backend, and frontend."
depends = ["dev:docker"]
run = "mise run dev:backend ::: dev:frontend"

[tasks."setup-hooks"]
description = "Install Git hooks for this repo."
run = "lefthook install"

# === Secondary tasks ===

[tasks."dev:docker"]
description = "Start local Postgres and Keycloak services for development, waiting until they are healthy."
run = "docker compose -f compose.dev.yaml up --detach --wait app-postgres keycloak-postgres keycloak"

[tasks."dev:frontend"]
description = "Start the Angular frontend dev server."
dir = "magnum-opus-frontend"
run = "bun run start -- --proxy-config proxy.conf.json"

[tasks."dev:backend"]
description = "Start the Spring Boot backend dev server against the local Postgres database."
dir = "magnum-opus-backend"
env = { SPRING_DATASOURCE_URL = "jdbc:postgresql://localhost:5432/magnum_opus", SPRING_DATASOURCE_USERNAME = "magnum_opus", SPRING_DATASOURCE_PASSWORD = "magnum_opus", SPRING_JPA_HIBERNATE_DDL_AUTO = "validate", SPRING_JPA_OPEN_IN_VIEW = "false", MANAGEMENT_HEALTH_REDIS_ENABLED = "false", OAUTH2_ISSUER_URI = "http://localhost:8180/realms/magnum-opus" }
run = "./mvnw spring-boot:run"

[tasks."db:nuke"]
description = "Recreate the local application database container and volume."
run = """
docker compose -f compose.dev.yaml stop app-postgres
docker compose -f compose.dev.yaml rm -f app-postgres
docker volume rm magnum-opus-app-postgres-data || true
docker compose -f compose.dev.yaml up -d app-postgres
"""

[tasks."apply:frontend"]
description = "Apply frontend formatting and autofixable lint fixes"
dir = "magnum-opus-frontend"
run = "bun run lint:fix && bun run format"

[tasks."apply:backend"]
description = "Apply backend formatting fixes with Spotless"
dir = "magnum-opus-backend"
run = "./mvnw spotless:apply"

[tasks."check:frontend"]
description = "Check frontend formatting and lint Angular TypeScript and HTML templates"
dir = "magnum-opus-frontend"
run = "bun run format:check && bun run lint"

[tasks."check:backend"]
description = "Check backend formatting and lint Spring Boot Java files"
dir = "magnum-opus-backend"
run = "./mvnw -DskipTests spotless:check checkstyle:check pmd:check compile spotbugs:check"

[tasks."format:frontend"]
description = "Alias for apply:frontend"
depends = ["apply:frontend"]

[tasks."format:backend"]
description = "Alias for apply:backend"
depends = ["apply:backend"]

[tasks."lint:frontend"]
description = "Alias for check:frontend"
depends = ["check:frontend"]

[tasks."lint:backend"]
description = "Alias for check:backend"
depends = ["check:backend"]
