apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: magnum-opus
  source:
    repoURL: https://valkey.io/valkey-helm/
    chart: valkey
    targetRevision: 0.*
    helm:
      releaseName: redis
      valuesObject:
        replica:
          replicaCount: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: cache
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
