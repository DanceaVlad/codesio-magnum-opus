name: Container Images

on:
    pull_request:
    push:
        branches:
            - main
        paths-ignore:
            - infra/apps/frontend/deployment.yaml
            - infra/apps/backend/deployment.yaml
    workflow_dispatch:

permissions:
    contents: write
    packages: write

concurrency:
    group: container-images-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-images:
        name: Build container images
        runs-on: ubuntu-latest
        timeout-minutes: 30

        strategy:
            matrix:
                include:
                    - name: frontend
                      context: magnum-opus-frontend
                      image: ghcr.io/danceavlad/codesio-magnum-opus/frontend
                    - name: backend
                      context: magnum-opus-backend
                      image: ghcr.io/danceavlad/codesio-magnum-opus/backend

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build ${{ matrix.name }}
              uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.context }}
                  push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                  tags: |
                      ${{ matrix.image }}:${{ github.sha }}
                      ${{ matrix.image }}:latest
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    promote-images:
        name: Promote image tags
        needs: build-images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Update app image tags
              shell: bash
              run: |
                  set -euo pipefail

                  frontend_image="ghcr.io/danceavlad/codesio-magnum-opus/frontend:${GITHUB_SHA}"
                  backend_image="ghcr.io/danceavlad/codesio-magnum-opus/backend:${GITHUB_SHA}"

                  sed -i "s#image: ghcr.io/danceavlad/codesio-magnum-opus/frontend:.*#image: ${frontend_image}#" infra/apps/frontend/deployment.yaml
                  sed -i "s#image: ghcr.io/danceavlad/codesio-magnum-opus/backend:.*#image: ${backend_image}#" infra/apps/backend/deployment.yaml

            - name: Commit promoted image tags
              shell: bash
              run: |
                  set -euo pipefail

                  if git diff --quiet -- infra/apps/frontend/deployment.yaml infra/apps/backend/deployment.yaml; then
                    echo "Image tags are already promoted."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add infra/apps/frontend/deployment.yaml infra/apps/backend/deployment.yaml
                  git commit -m "Promote app images to ${GITHUB_SHA}"
                  git push
