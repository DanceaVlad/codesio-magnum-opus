name: Container Images

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: container-images-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        name: Build container images
        runs-on: ubuntu-latest
        timeout-minutes: 30

        strategy:
            matrix:
                include:
                    - name: frontend
                      context: magnum-opus-frontend
                      image: ghcr.io/danceavlad/codesio-magnum-opus/frontend
                    - name: backend
                      context: magnum-opus-backend
                      image: ghcr.io/danceavlad/codesio-magnum-opus/backend

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build ${{ matrix.name }}
              uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.context }}
                  push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                  tags: |
                      ${{ matrix.image }}:${{ github.sha }}
                      ${{ matrix.image }}:latest
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}
