name: Backend Check

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: backend-check-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Backend change detection
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.changed-files.outputs.backend }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Detect backend changes
              id: changed-files
              shell: bash
              run: |
                  changed_files="$(mktemp)"

                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "${changed_files}"
                  elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
                    git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "${changed_files}"
                  else
                    printf '%s\n' "magnum-opus-backend/" > "${changed_files}"
                  fi

                  if grep -Eq '^(magnum-opus-backend/|mise\.toml$|\.github/workflows/backend-check\.yml$)' "${changed_files}"; then
                    echo "backend=true" >> "${GITHUB_OUTPUT}"
                  else
                    echo "backend=false" >> "${GITHUB_OUTPUT}"
                  fi

    backend-check:
        name: Backend formatting and linting
        needs: changes
        if: needs.changes.outputs.backend == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up mise tools
              uses: jdx/mise-action@v3
              with:
                  install_args: java
                  cache: true

            - name: Cache Maven repository
              uses: actions/cache@v5
              with:
                  path: ~/.m2/repository
                  key: ${{ runner.os }}-maven-${{ hashFiles('magnum-opus-backend/pom.xml', 'magnum-opus-backend/.mvn/**') }}
                  restore-keys: |
                      ${{ runner.os }}-maven-

            - name: Check backend formatting and linting
              run: mise run check:backend
